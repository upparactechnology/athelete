name: Deploy Athlete POV

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athlete-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true

          script: |
            set -e

            echo "======================================"
            echo "Athlete POV deployment started"
            echo "======================================"

            APP_DIR="/var/www/athlete-backend"
            WEBSITE_DIR="/home/user/web/athletespov.com/public_html"

            cd "$APP_DIR"

            echo "Recording current commit..."
            CURRENT_SHA=$(git rev-parse HEAD)

            echo "Fetching latest code from GitHub..."
            git fetch origin main

            TARGET_SHA=$(git rev-parse origin/main)

            echo "Current commit: $CURRENT_SHA"
            echo "Target commit:  $TARGET_SHA"

            if [ "$CURRENT_SHA" = "$TARGET_SHA" ]; then
              echo "No new commit to deploy"
              exit 0
            fi

            echo "Detecting changed files..."
            CHANGED_FILES=$(git diff --name-only "$CURRENT_SHA" "$TARGET_SHA")

            echo "Changed files:"
            echo "$CHANGED_FILES"

            WEBSITE_CHANGED=false
            DEPENDENCIES_CHANGED=false
            PRISMA_CHANGED=false
            BACKEND_CHANGED=false
            ADMIN_CHANGED=false

            if echo "$CHANGED_FILES" | grep -qE '^website/'; then
              WEBSITE_CHANGED=true
            fi

            if echo "$CHANGED_FILES" | grep -qE '^(package\.json|package-lock\.json)$'; then
              DEPENDENCIES_CHANGED=true
            fi

            if echo "$CHANGED_FILES" | grep -qE '^prisma/'; then
              PRISMA_CHANGED=true
            fi

            if echo "$CHANGED_FILES" | grep -qE '^src/'; then
              BACKEND_CHANGED=true
            fi

            if echo "$CHANGED_FILES" | grep -qE '^public/admin/'; then
              ADMIN_CHANGED=true
            fi

            if [ "$DEPENDENCIES_CHANGED" = true ]; then
              BACKEND_CHANGED=true
            fi

            echo "Website changed: $WEBSITE_CHANGED"
            echo "Dependencies changed: $DEPENDENCIES_CHANGED"
            echo "Prisma changed: $PRISMA_CHANGED"
            echo "Backend changed: $BACKEND_CHANGED"
            echo "Admin changed: $ADMIN_CHANGED"

            if [ "$WEBSITE_CHANGED" = false ] \
              && [ "$DEPENDENCIES_CHANGED" = false ] \
              && [ "$PRISMA_CHANGED" = false ] \
              && [ "$BACKEND_CHANGED" = false ] \
              && [ "$ADMIN_CHANGED" = false ]; then
              echo "No deployment work required for this commit"
              git reset --hard "$TARGET_SHA"
              exit 0
            fi

            echo "Updating working tree to target commit..."
            git reset --hard "$TARGET_SHA"

            if [ -s /root/.nvm/nvm.sh ]; then
              source /root/.nvm/nvm.sh
              if nvm use 22; then
                echo "Using Node 22 via NVM"
              else
                echo "WARNING: Node 22 not installed in NVM; using system Node $(node --version)"
              fi
            else
              echo "WARNING: NVM not found at /root/.nvm/nvm.sh; using system Node $(node --version)"
            fi

            if [ "$DEPENDENCIES_CHANGED" = true ]; then
              echo "Running dependency installation..."
              npm ci
            fi

            if [ "$PRISMA_CHANGED" = true ]; then
              echo "Running Prisma migrations..."
              npx prisma generate
              npx prisma migrate deploy
            fi

            if [ "$BACKEND_CHANGED" = true ]; then
              echo "Running backend build..."
              npm run build

              echo "Restarting athlete-backend..."
              pm2 restart athlete-backend --update-env
            fi

            if [ "$WEBSITE_CHANGED" = true ]; then
              echo "Running website deployment..."
              mkdir -p "$WEBSITE_DIR"
              rsync -a --delete website/ "$WEBSITE_DIR"/

              echo "Running website logo deployment..."
              mkdir -p "$WEBSITE_DIR/logos"
              rsync -a logos/ "$WEBSITE_DIR/logos"/

              echo "Fixing website ownership..."
              chown -R user:user "$WEBSITE_DIR"
            fi

            if [ "$BACKEND_CHANGED" = true ]; then
              echo "Waiting for athlete-backend health check..."
              ADMIN_OK=false
              for i in $(seq 1 30); do
                ADMIN_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://athletespov.com/admin/login.html || true)
                if [ "$ADMIN_CODE" = "200" ]; then
                  ADMIN_OK=true
                  break
                fi
                sleep 2
              done

              if [ "$ADMIN_OK" = false ]; then
                echo "Admin health check failed"
                exit 1
              fi

              echo "Testing API routing..."
              API_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://athletespov.com/api/ || true)

              if [ "$API_CODE" != "401" ] && [ "$API_CODE" != "200" ]; then
                echo "API health check failed: HTTP $API_CODE"
                exit 1
              fi
            fi

            if [ "$WEBSITE_CHANGED" = true ]; then
              echo "Testing website..."
              SITE_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://athletespov.com/ || true)

              if [ "$SITE_CODE" != "200" ]; then
                echo "Website health check failed: HTTP $SITE_CODE"
                exit 1
              fi
            fi

            if [ "$BACKEND_CHANGED" = true ]; then
              pm2 status

              if ! pm2 status | grep "athlete-backend" | grep -q "online"; then
                echo "athlete-backend is not online"
                exit 1
              fi
            fi

            echo "======================================"
            echo "Athlete POV deployment successful"
            echo "======================================"
